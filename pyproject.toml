[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-actions-guard"
version = "0.1.0"
description = "Offline static trust-boundary checks for AI-agent GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PremLabs"}]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
agentic-actions-guard = "agentic_actions_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
